name: certified-profile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    # Pinned runner image: the toolchain below is pinned too.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit SHA (the tag is in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path runtime/bind-runtime/Cargo.toml
      - run: node runtime/bind-runtime-js/tests/run.mjs
      # `certify` only accepts the committed locks (bind.lock and .bind/locks/): a fresh clone
      # builds exactly the recorded dependency graph, and a lock change fails here.
      - run: cargo run --locked -- certify --target aws-lambda-ssr
      - run: cargo run --locked -- certify --target aws-lambda-split
      - run: cargo run --locked -- certify --target vercel-ssr
      - run: cargo run --locked -- certify --target vercel-split
      - run: cargo run --locked -- certify --manifest examples/cloudflare-pure/bind.toml --target cloudflare
